<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>V1 פיד חדשות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f10; --surface:#1a1a1c; --surface2:#242427;
    --border:#2e2e32; --text:#e8e8ea; --text-muted:#888890;
    --text-dim:#555560; --accent:#e63f2e; --accent-soft:rgba(230,63,46,0.12);
    --tag-bg:#22222a; --radius:10px; color-scheme:dark;
  }
  @media (prefers-color-scheme:light) {
    :root {
      --bg:#f2f2f4; --surface:#fff; --surface2:#f7f7f9; --border:#e0e0e5;
      --text:#111115; --text-muted:#666670; --text-dim:#aaaab0; --tag-bg:#eaeaf0; color-scheme:light;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}

  /* Header */
  .header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
    border-bottom:1px solid var(--border);padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{font-size:22px;font-weight:700;color:var(--accent);}
  .logo-sub{font-size:13px;color:var(--text-muted);font-weight:300;display:flex;align-items:center;gap:6px;}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#2ecc71;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
  .header-right{display:flex;align-items:center;gap:10px;}
  .last-updated{font-size:12px;color:var(--text-dim);}
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);
    padding:7px 14px;border-radius:20px;font-family:'Heebo',sans-serif;font-size:13px;
    cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s;}
  .btn:hover:not(:disabled){color:var(--text);border-color:var(--text-muted);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.loading .spin{animation:spin .8s linear infinite;}
  .spin{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Filters */
  .filters{padding:12px 24px;border-bottom:1px solid var(--border);
    display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .filters::-webkit-scrollbar{display:none;}
  .chip{background:var(--tag-bg);border:1px solid var(--border);color:var(--text-muted);
    padding:5px 14px;border-radius:20px;font-family:'Heebo',sans-serif;font-size:13px;
    cursor:pointer;white-space:nowrap;transition:all .15s;}
  .chip:hover{color:var(--text);}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);}

  /* Feed */
  .feed{max-width:760px;margin:0 auto;padding:20px;}

  /* Skeleton */
  .sk{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;padding:16px;display:flex;gap:14px;align-items:center;}
  .sk-img{width:90px;height:56px;border-radius:6px;background:var(--surface2);flex-shrink:0;
    animation:shim 1.4s infinite;}
  .sk-body{flex:1;display:flex;flex-direction:column;gap:8px;}
  .sk-line{height:12px;border-radius:4px;background:var(--surface2);animation:shim 1.4s infinite;}
  .sk-line.s{width:38%;} .sk-line.l{width:88%;} .sk-line.m{width:62%;}
  @keyframes shim{0%,100%{opacity:.5}50%{opacity:1}}

  /* Date separator */
  .sep{display:flex;align-items:center;gap:12px;padding:20px 0 10px;
    color:var(--text-dim);font-size:12px;font-weight:500;}
  .sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--border);}

  /* Item */
  .item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;transition:border-color .15s;cursor:pointer;}
  .item:hover{border-color:var(--text-dim);}
  .item.open{border-color:var(--accent);}
  .item.fresh{animation:pop .4s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}

  .item-row{display:flex;align-items:flex-start;gap:14px;padding:16px;}
  .thumb{width:90px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--surface2);}
  .meta{flex:1;min-width:0;}
  .tags{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .time-tag{font-size:12px;color:var(--accent);font-weight:500;font-variant-numeric:tabular-nums;}
  .dot{color:var(--text-dim);font-size:10px;}
  .cat-tag{font-size:11px;color:var(--text-dim);background:var(--tag-bg);padding:2px 8px;border-radius:10px;}
  .title{font-size:15px;font-weight:500;line-height:1.4;color:var(--text);}
  .chevron{color:var(--text-dim);flex-shrink:0;align-self:center;transition:transform .2s;margin-inline-start:4px;}
  .item.open .chevron{transform:rotate(180deg);}

  .panel{display:none;border-top:1px solid var(--border);}
  .item.open .panel{display:block;}
  .panel video{width:100%;max-height:400px;display:block;background:#000;}
  .panel-desc{padding:12px 16px;font-size:13px;color:var(--text-muted);line-height:1.6;
    background:var(--surface2);border-top:1px solid var(--border);}
  .panel-link{display:block;padding:10px 16px;font-size:13px;color:var(--accent);
    background:var(--surface2);border-top:1px solid var(--border);text-decoration:none;}
  .panel-link:hover{text-decoration:underline;}

  .empty{text-align:center;padding:60px 20px;color:var(--text-muted);font-size:15px;}
  .err{background:var(--surface);border:1px solid #5a1010;border-radius:var(--radius);
    padding:24px;text-align:center;color:#ff8888;line-height:1.7;}
  .err small{display:block;margin-top:8px;font-size:11px;color:var(--text-dim);}
  .err-btn{margin-top:14px;background:var(--accent);color:#fff;border:none;padding:8px 20px;
    border-radius:20px;font-family:'Heebo',sans-serif;font-size:13px;cursor:pointer;}
  .count{font-size:12px;color:var(--text-dim);text-align:center;padding:10px;margin-top:6px;}

  @media(max-width:500px){
    .header,.filters{padding-inline:16px;}
    .feed{padding:14px 12px;}
    .thumb{width:72px;height:46px;}
    .title{font-size:14px;}
    .item-row{gap:10px;padding:12px;}
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <span class="logo">V1</span>
    <span class="logo-sub">פיד <span class="live-dot"></span></span>
  </div>
  <div class="header-right">
    <span class="last-updated" id="ts"></span>
    <button class="btn" id="refreshBtn" onclick="load(true)">
      <span class="spin">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
        </svg>
      </span>
      <span id="btnLabel">רענן</span>
    </button>
  </div>
</header>

<div class="filters" id="filters">
  <button class="chip active" onclick="filter('הכל',this)">הכל</button>
</div>

<div class="feed" id="feed"></div>

<script>
// ── config ──────────────────────────────────────────────────────────────────
// When running on Vercel, API_URL will be /api/feed (same origin).
// When testing locally open index.html directly, it falls back to the
// Vercel deployment URL — update this after your first deploy.
const API_URL = window.location.hostname === 'localhost' || window.location.protocol === 'file:'
  ? 'REPLACE_WITH_YOUR_VERCEL_URL/api/feed'   // ← update after first deploy
  : '/api/feed';

// ── state ───────────────────────────────────────────────────────────────────
let items = [];
let activeCat = 'הכל';
let openIdx = null;
let busy = false;

// ── utils ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmtTime(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  } catch { return ''; }
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const days   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
    const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
    return `יום ${days[d.getDay()]}, ${d.getDate()} ב${months[d.getMonth()]} ${d.getFullYear()}`;
  } catch { return ''; }
}

function dayKey(iso) {
  if (!iso) return 'x';
  try { const d = new Date(iso); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }
  catch { return iso.slice(0,10); }
}

function nowHHMM() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

// ── filter ──────────────────────────────────────────────────────────────────
function filter(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  openIdx = null;
  render();
}

function buildFilters() {
  const cats = ['הכל', ...new Set(items.map(i => i.cat).filter(Boolean))];
  const bar = $('filters');
  bar.innerHTML = '';
  cats.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'chip' + (cat === activeCat ? ' active' : '');
    b.textContent = cat;
    b.onclick = () => filter(cat, b);
    bar.appendChild(b);
  });
}

// ── render ───────────────────────────────────────────────────────────────────
function render(freshTitles) {
  const feed = $('feed');
  const list = activeCat === 'הכל' ? items : items.filter(i => i.cat === activeCat);

  if (!list.length) {
    feed.innerHTML = '<div class="empty">אין פריטים</div>';
    return;
  }

  let html = '';
  let lastDay = null;

  list.forEach((item, idx) => {
    const day = dayKey(item.time);
    if (day !== lastDay) {
      html += `<div class="sep">${fmtDate(item.time) || day}</div>`;
      lastDay = day;
    }

    const isOpen  = openIdx === idx;
    const isFresh = freshTitles && freshTitles.has(item.title);
    const thumb   = item.thumb ? `<img class="thumb" src="${item.thumb}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
    const timeTag = item.time  ? `<span class="time-tag">${fmtTime(item.time)}</span><span class="dot">·</span>` : '';
    const catTag  = item.cat   ? `<span class="cat-tag">${item.cat}</span>` : '';
    const video   = item.video || '';
    const link    = item.link  || 'https://www.v-1.co.il';
    const desc    = item.desc  ? `<div class="panel-desc">${item.desc}</div>` : '';

    html += `
<div class="item${isOpen?' open':''}${isFresh?' fresh':''}" id="it${idx}" onclick="toggle(${idx})">
  <div class="item-row">
    ${thumb}
    <div class="meta">
      <div class="tags">${timeTag}${catTag}</div>
      <div class="title">${item.title}</div>
    </div>
    <span class="chevron">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </span>
  </div>
  <div class="panel">${isOpen ? `
    <video controls autoplay playsinline>
      <source src="${video}" type="application/x-mpegURL">
      <source src="${video}" type="video/mp4">
    </video>
    ${desc}
    <a class="panel-link" href="${link}" target="_blank" rel="noopener">פתח ב-V1 ←</a>` : ''}
  </div>
</div>`;
  });

  html += `<div class="count">${list.length} פריטים</div>`;
  feed.innerHTML = html;
}

function toggle(idx) {
  openIdx = openIdx === idx ? null : idx;
  render();
  setTimeout(() => {
    const el = $(`it${idx}`);
    if (el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }, 50);
}

// ── skeleton ─────────────────────────────────────────────────────────────────
function showSkeleton() {
  $('feed').innerHTML = [1,2,3].map(() => `
    <div class="sk">
      <div class="sk-img"></div>
      <div class="sk-body">
        <div class="sk-line s"></div>
        <div class="sk-line l"></div>
        <div class="sk-line m"></div>
      </div>
    </div>`).join('');
}

// ── load ─────────────────────────────────────────────────────────────────────
async function load(manual) {
  if (busy) return;
  busy = true;

  const btn   = $('refreshBtn');
  const label = $('btnLabel');
  btn.classList.add('loading');
  btn.disabled = true;
  label.textContent = 'טוען...';
  $('ts').textContent = 'מתחבר ל-V1…';

  if (!items.length) showSkeleton();

  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (!data.ok) throw new Error(data.error || 'שגיאת שרת');
    // items check ok

    const prevTitles  = new Set(items.map(i => i.title));
    const freshTitles = new Set(data.items.filter(i => !prevTitles.has(i.title)).map(i => i.title));

    items = data.items;

    // Stay on current filter only if it still has items
    if (activeCat !== 'הכל' && !items.some(i => i.cat === activeCat)) activeCat = 'הכל';

    buildFilters();
    render(freshTitles);

    const n = freshTitles.size;
    $('ts').textContent = `עודכן ${nowHHMM()}${n ? ` · ${n} חדשים` : ''}`;

  } catch (err) {
    console.error(err);
    if (items.length) {
      // Keep showing existing items
      $('ts').textContent = `⚠ שגיאה — ${nowHHMM()}`;
    } else {
      $('feed').innerHTML = `
        <div class="err">
          ⚠️ לא הצלחתי להתחבר לשרת
          <small>${err.message}</small>
          <br><button class="err-btn" onclick="load()">נסה שוב</button>
        </div>`;
      $('ts').textContent = '';
    }
  } finally {
    busy = false;
    btn.classList.remove('loading');
    btn.disabled = false;
    label.textContent = 'רענן';
  }
}

load();
</script>
</body>
</html>
